name: Docker Mirror Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull & Sync To ACR
    runs-on: ubuntu-latest
    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          # remove-android: 'true'
          # remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Sync images from images.txt to Aliyun ACR
        run: |
          #!/usr/bin/env bash
          set -eo pipefail
          shopt -s inherit_errexit

          declare -A duplicate_images
          declare -A temp_map
          declare -A seen_lines
          success_count=0
          fail_count=0

          # 解析函数，输入完整镜像字符串，输出：raw_image image_name_tag name_space image_name
          parse_image() {
            local input="$1"
            local image="${input%%@*}"
            local image_name_tag
            local name_space
            local image_name

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 支持 registry/ns/name 、ns/name、name 三种形式
            local slash_cnt=$(grep -o '/' <<< "$image" | wc -l)
            if [[ $slash_cnt -ge 2 ]]; then
              name_space=$(echo "$image" | cut -d'/' -f2)
            elif [[ $slash_cnt -eq 1 ]]; then
              name_space=$(echo "$image" | cut -d'/' -f1)
            else
              name_space=""
            fi
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            echo "$image|$image_name_tag|$name_space|$image_name"
          }

          # 第一轮：冲突检测 + 去重
          while IFS= read -r line || [[ -n "$line" ]]; do
            # 清理首尾空白
            line=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            # 去重
            if [[ -n "${seen_lines[$line]}" ]]; then
              echo "[SKIP DUPLICATE LINE] $line"
              continue
            fi
            seen_lines["$line"]=1

            # 取最后一个参数为镜像引用
            read -r -a args <<< "$line"
            raw_img_ref="${args[-1]}"
            parts=$(parse_image "$raw_img_ref")
            IFS='|' read -r image image_name_tag name_space image_name <<< "$parts"

            ns_key="${name_space}_"
            if [[ -n "${temp_map[$image_name]}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$ns_key" ]]; then
                echo "[CONFLICT DETECT] same image name, different namespace: $image_name"
                duplicate_images[$image_name]="1"
              fi
            else
              temp_map[$image_name]="$ns_key"
            fi
          done < images.txt

          # 第二轮：拉取、打标、推送、清理
          while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -n "${seen_lines_processed[$line]}" ]] && continue
            seen_lines_processed["$line"]=1

            echo "============================================================"
            echo "[PROCESS] $line"
            read -r -a args <<< "$line"
            raw_img_ref="${args[-1]}"

            # 提取 --platform 参数
            platform=""
            for ((i=0; i<${#args[@]}; i++)); do
              if [[ "${args[$i]}" == "--platform" && -n "${args[$i+1]}" ]]; then
                platform="${args[$i+1]}"
                break
              fi
            done

            parts=$(parse_image "$raw_img_ref")
            IFS='|' read -r image image_name_tag name_space image_name <<< "$parts"

            # 构造前缀
            platform_prefix=""
            if [[ -n "$platform" ]]; then
              platform_prefix="${platform//\//_}-"
            fi
            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}-"
            fi

            new_image="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/${platform_prefix}${name_space_prefix}${image_name_tag}"
            echo "[TARGET] $new_image"

            set +e
            if docker pull "${args[@]}"; then
              docker tag "$image" "$new_image"
              docker push "$new_image"
              echo "[SUCCESS] $line"
              success_count=$((success_count + 1))
            else
              echo "[FAIL] pull or push failed: $line"
              fail_count=$((fail_count + 1))
            fi
            # 尽可能清理，清理失败不阻断统计
            docker rmi "$image" || true
            docker rmi "$new_image" || true
            set -e

            echo "[DISK AFTER]"
            df -hT
            echo "============================================================"
          done < images.txt

          echo -e "\n===== SYNC SUMMARY ====="
          echo "Total Success: $success_count"
          echo "Total Failed:  $fail_count"
          if [[ $fail_count -gt 0 ]]; then
            echo "There are failed mirror sync tasks, mark job as failed."
            exit 1
          fi
