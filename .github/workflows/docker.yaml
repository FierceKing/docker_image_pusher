name: Docker Mirror Sync
on:
  workflow_dispatch:
  push:
    branches: [ FierceKing-patch-1 ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  TARGET_REPO: "maximus-hub"

jobs:
  build:
    name: Pull & Sync To ACR
    runs-on: ubuntu-latest
    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          root-reserve-mb: 4096
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

      - name: Enable buildx
        uses: docker/setup-buildx-action@v3

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      # 不需要 DHI 镜像时注释掉这一段
      - name: Login to dhi.io (DHI)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_REGISTRY_USER }}
          password: ${{ secrets.DHI_REGISTRY_TOKEN }}

      - name: Sync images from images.txt to Aliyun ACR
        run: |
          #!/usr/bin/env bash
          set -eo pipefail
          shopt -s inherit_errexit 2>/dev/null || true

          if [[ ! -f images.txt ]]; then
            echo "[ERROR] images.txt not found in repo!"
            exit 1
          fi

          declare -A seen_lines
          declare -A seen_final_tag
          success_count=0
          fail_count=0
          lines=()

          make_safe_tag() {
            local raw="$1"
            echo "$raw" | sed 's/[\/:]/-/g'
          }

          # 一次性读入内存，全程不再二次读文件
          while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ -n "${seen_lines[$line]}" ]]; then
              echo "[SKIP DUPLICATE LINE] $line"
              continue
            fi
            seen_lines["$line"]=1
            lines+=("$line")

            read -r -a args <<< "$line"
            raw_img_ref="${args[-1]}"

            platform=""
            for ((i=0; i<${#args[@]}-1; i++)); do
              if [[ "${args[$i]}" == "--platform" ]]; then
                platform="${args[$i+1]}"
                break
              fi
            done

            safe_tag=$(make_safe_tag "$raw_img_ref")
            platform_prefix=""
            if [[ -n "$platform" ]]; then
              platform_prefix="${platform//\//_}-"
            fi
            final_tag="${platform_prefix}${safe_tag}"
            if [[ -n "${seen_final_tag[$final_tag]}" ]]; then
              echo "[FATAL CONFLICT] target tag collision: ${final_tag}, line: $line"
              exit 1
            fi
            seen_final_tag["$final_tag"]=1
          done < images.txt

          for line in "${lines[@]}"; do
            echo "============================================================"
            echo "[PROCESS] $line"
            read -r -a args <<< "$line"
            raw_img_ref="${args[-1]}"

            platform=""
            for ((i=0; i<${#args[@]}-1; i++)); do
              if [[ "${args[$i]}" == "--platform" ]]; then
                platform="${args[$i+1]}"
                break
              fi
            done

            safe_tag=$(make_safe_tag "$raw_img_ref")
            platform_prefix=""
            if [[ -n "$platform" ]]; then
              platform_prefix="${platform//\//_}-"
            fi

            new_image="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/${{ env.TARGET_REPO }}:${platform_prefix}${safe_tag}"
            echo "[TARGET] $new_image"

            set +e
            if docker buildx imagetools create --tag "${new_image}" "${raw_img_ref}"; then
              echo "[SUCCESS] $line"
              success_count=$((success_count + 1))
            else
              echo "[FAIL] $line"
              echo "  Source: $raw_img_ref"
              echo "  Target: $new_image"
              fail_count=$((fail_count + 1))
            fi
            set -e

            echo "============================================================"
          done

          echo -e "\n===== SYNC SUMMARY ====="
          echo "Total Success: $success_count"
          echo "Total Failed:  $fail_count"
          if [[ $fail_count -gt 0 ]]; then
            echo "There are failed mirror sync tasks, mark job as failed."
            exit 1
          fi
