name: Docker Mirror Sync
on:
  workflow_dispatch:
  push:
    branches: [ FierceKing-patch-1 ]
  schedule:
    # 每月 1 日 08:00 北京时间（= 每月 1 日 00:00 UTC）
    - cron: '0 0 1 * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  TARGET_REPO: "maximus-hub"
  # 目标 NAS 架构：amd64 = 主流 Intel/AMD 群晖；arm64 = ARM 群晖（如 DS223/DS124 等）
  MIRROR_ARCH: "amd64"

jobs:
  build:
    name: Pull & Sync To ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Sync images from images.txt to Aliyun ACR
        run: |
          #!/usr/bin/env bash
          set -eo pipefail

          if [[ ! -f images.txt ]]; then
            echo "[ERROR] images.txt not found in repo!"
            exit 1
          fi

          AUTHFILE="$HOME/.docker/config.json"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/tmp/sync_summary.md}"

          declare -A seen_lines
          declare -A seen_final_tag
          raw_refs=()
          final_tags=()
          success_count=0
          fail_count=0

          # 把镜像引用里的 / 和 : 替换成 -，作为单仓库里的安全 tag
          make_safe_tag() {
            printf '%s\n' "$1" | sed 's/[\/:]/-/g'
          }

          # 第一轮：读入去重 -> 生成基础 tag -> 冲突预检查 -> 暂存
          while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(printf '%s\n' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [[ -n "${seen_lines[$line]}" ]]; then
              echo "[SKIP DUPLICATE] $line"
              continue
            fi
            seen_lines["$line"]=1

            raw_img_ref="$line"
            final_tag=$(make_safe_tag "$raw_img_ref")

            if [[ -n "${seen_final_tag[$final_tag]}" ]]; then
              echo "[FATAL CONFLICT] target tag collision: $final_tag, line: $line"
              exit 1
            fi
            seen_final_tag["$final_tag"]=1

            raw_refs+=("$raw_img_ref")
            final_tags+=("$final_tag")
          done < images.txt

          echo "| Source | Version | ACR tags | Digest (ACR v2) |" >> "$SUMMARY"
          echo "|---|---|---|---|" >> "$SUMMARY"

          for idx in "${!final_tags[@]}"; do
            raw_img_ref="${raw_refs[$idx]}"
            base_tag="${final_tags[$idx]}"
            main_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${TARGET_REPO}:${base_tag}"

            echo "============================================================"
            echo "[SYNC] docker://${raw_img_ref} -> :${base_tag}  (linux/${MIRROR_ARCH}, v2s2)"

            # 1) 版本号：直接读 image config 的 Labels（--config 最可靠，不依赖 inspect 的顶层派生字段）
            skopeo inspect --config --override-os linux --override-arch "${MIRROR_ARCH}" \
              --authfile "${AUTHFILE}" "docker://${raw_img_ref}" > /tmp/_cfg.json 2>/dev/null || true
            version=$(python3 -c 'import json;d=json.load(open("/tmp/_cfg.json"));print(((d.get("config") or {}).get("Labels") or {}).get("org.opencontainers.image.version","") or "")' 2>/dev/null || echo "")
            # fallback：--config 若取不到（个别 skopeo 版本对多架构 index 的 --config 行为差异），改用默认 inspect 的顶层 Labels
            if [[ -z "$version" ]]; then
              skopeo inspect --override-os linux --override-arch "${MIRROR_ARCH}" \
                --authfile "${AUTHFILE}" "docker://${raw_img_ref}" > /tmp/_inspect.json 2>/dev/null || true
              version=$(python3 -c 'import json;print((json.load(open("/tmp/_inspect.json")).get("Labels") or {}).get("org.opencontainers.image.version","") or "")' 2>/dev/null || echo "")
            fi
            # 源 digest：所选平台 manifest 的 digest（仅记录）
            src_digest=$(skopeo inspect --override-os linux --override-arch "${MIRROR_ARCH}" \
              --authfile "${AUTHFILE}" --format '{{.Digest}}' "docker://${raw_img_ref}" 2>/dev/null || echo "")
            echo "[INFO] version=${version:-<none>}  src_digest=${src_digest:-<none>}"

            # 2) 推主 tag（latest 内容，强制转 Docker v2）
            if skopeo copy --retry-times 3 --format v2s2 \
                 --override-os linux --override-arch "${MIRROR_ARCH}" \
                 --authfile "${AUTHFILE}" \
                 "docker://${raw_img_ref}" \
                 "docker://${main_image}"; then
              echo "[SUCCESS] ${raw_img_ref} -> :${base_tag}"
              success_count=$((success_count + 1))
            else
              echo "[FAIL] ${raw_img_ref} -> :${base_tag}"
              fail_count=$((fail_count + 1))
              echo "| ${raw_img_ref} | ${version:-?} | ${base_tag} (failed) | - |" >> "$SUMMARY"
              continue
            fi

            # 3) 拿 ACR 上转换后的 digest
            acr_digest=$(skopeo inspect --authfile "${AUTHFILE}" --format '{{.Digest}}' \
                           "docker://${main_image}" 2>/dev/null || true)

            # 4) 打版本号 tag（已存在同 digest 则跳过，避免重复传输）
            ver_tags_field="${base_tag}"
            if [[ -n "$version" ]]; then
              ver_tag="${base_tag}-$(make_safe_tag "$version")"
              ver_tags_field="${base_tag} / ${ver_tag}"
              ver_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${TARGET_REPO}:${ver_tag}"
              existing=$(skopeo inspect --authfile "${AUTHFILE}" --format '{{.Digest}}' "docker://${ver_image}" 2>/dev/null || true)
              if [[ -n "$acr_digest" && "$existing" == "$acr_digest" ]]; then
                echo "[SKIP] :${ver_tag} 已存在且 digest 一致"
              else
                if skopeo copy --retry-times 3 --format v2s2 \
                     --override-os linux --override-arch "${MIRROR_ARCH}" \
                     --authfile "${AUTHFILE}" \
                     "docker://${raw_img_ref}" \
                     "docker://${ver_image}"; then
                  echo "[SUCCESS] ${raw_img_ref} -> :${ver_tag}"
                  success_count=$((success_count + 1))
                else
                  echo "[FAIL] ${raw_img_ref} -> :${ver_tag}"
                  fail_count=$((fail_count + 1))
                fi
              fi
            else
              echo "[WARN] 源镜像 label 中没有版本号，跳过版本 tag"
            fi

            echo "[INFO] acr_digest=${acr_digest:-<unknown>}"
            echo "| ${raw_img_ref} | ${version:-?} | ${ver_tags_field} | ${acr_digest:-?} |" >> "$SUMMARY"
          done

          echo "===== SYNC SUMMARY ====="
          echo "Total Success: $success_count"
          echo "Total Failed:  $fail_count"
          if [[ $fail_count -gt 0 ]]; then
            echo "There are failed mirror sync tasks, mark job as failed."
            exit 1
          fi
