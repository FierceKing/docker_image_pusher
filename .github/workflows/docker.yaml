name: Docker Mirror Sync

on:
  workflow_dispatch:
  push:
    branches: [ FierceKing-patch-1 ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 固定你的目标仓库名，不要改
  TARGET_REPO: "maximus-hub"

jobs:
  build:
    name: Pull & Sync To ACR
    runs-on: ubuntu-latest
    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      # 可选：DHI(dhi.io) 需要docker hub账号登录，不需要就注释掉这一段
      - name: Login to dhi.io (DHI)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync images from images.txt to Aliyun ACR
        run: |
          #!/usr/bin/env bash
          set -eo pipefail
          shopt -s inherit_errexit

          declare -A duplicate_images
          declare -A temp_map
          declare -A seen_lines
          declare -A seen_lines_processed
          success_count=0
          fail_count=0

          # 【新版解析函数】
          # 输入完整镜像引用，例如 dhi.io/vaultwarden:1-debian  / vaultwarden/server:1.37.5-alpine
          # 输出安全tag：把所有 / : 替换成 -，保证能放进单仓库的tag里
          make_safe_tag() {
            local raw="$1"
            # 替换 / : 为 -
            echo "$raw" | sed 's/[\/:]/-/g'
          }

          # 第一轮：冲突检测 + 去重
          while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ -n "${seen_lines[$line]}" ]]; then
              echo "[SKIP DUPLICATE LINE] $line"
              continue
            fi
            seen_lines["$line"]=1

            read -r -a args <<< "$line"
            raw_img_ref="${args[-1]}"
            safe_tag=$(make_safe_tag "$raw_img_ref")
            temp_map["$safe_tag"]=1
          done < images.txt

          # 第二轮：拉取、打标、推送、清理
          while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -n "${seen_lines_processed[$line]}" ]] && continue
            seen_lines_processed["$line"]=1

            echo "============================================================"
            echo "[PROCESS] $line"
            read -r -a args <<< "$line"
            raw_img_ref="${args[-1]}"

            # 提取 --platform 参数
            platform=""
            for ((i=0; i<${#args[@]}; i++)); do
              if [[ "${args[$i]}" == "--platform" && -n "${args[$i+1]}" ]]; then
                platform="${args[$i+1]}"
                break
              fi
            done

            safe_tag=$(make_safe_tag "$raw_img_ref")
            platform_prefix=""
            if [[ -n "$platform" ]]; then
              platform_prefix="${platform//\//_}-"
            fi

            # 固定目标：ALIYUN_REGISTRY / ALIYUN_NAME_SPACE / TARGET_REPO : tag
            new_image="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/${{ env.TARGET_REPO }}:${platform_prefix}${safe_tag}"
            echo "[TARGET] $new_image"

            set +e
            if docker pull "${args[@]}"; then
              docker tag "$raw_img_ref" "$new_image"
              docker push "$new_image"
              echo "[SUCCESS] $line"
              success_count=$((success_count + 1))
            else
              echo "[FAIL] pull or push failed: $line"
              fail_count=$((fail_count + 1))
            fi
            docker rmi "$raw_img_ref" || true
            docker rmi "$new_image" || true
            set -e

            echo "[DISK AFTER]"
            df -hT
            echo "============================================================"
          done < images.txt

          echo -e "\n===== SYNC SUMMARY ====="
          echo "Total Success: $success_count"
          echo "Total Failed:  $fail_count"
          if [[ $fail_count -gt 0 ]]; then
            echo "There are failed mirror sync tasks, mark job as failed."
            exit 1
          fi
